[package]
name = "hippoclaudus"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
proptest = "1"
tempfile = "3"

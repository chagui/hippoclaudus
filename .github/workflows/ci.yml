name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --release

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        run: cargo nextest run --profile ci

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: Hippo
        run: swift build -c release

      - name: Test
        working-directory: Hippo
        run: swift test

  coverage:
    runs-on: macos-latest
    needs: [rust, swift]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Rust coverage (fail under 80%)
        run: cargo llvm-cov nextest --fail-under-lines 80

      - name: Swift coverage
        working-directory: Hippo
        run: |
          swift test --enable-code-coverage

          BIN="$(find .build -path "*/HippoPackageTests.xctest/Contents/MacOS/HippoPackageTests" -type f | head -1)"
          PROFDATA="$(find .build -name default.profdata | head -1)"

          if [[ -z "$BIN" || -z "$PROFDATA" ]]; then
            echo "Could not locate coverage artifacts."
            exit 1
          fi

          xcrun llvm-cov report "$BIN" \
            -instr-profile="$PROFDATA" \
            -ignore-filename-regex='(.build/|Tests/)'

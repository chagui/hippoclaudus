pre-commit:
  parallel: false
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --check
    rust-clippy:
      glob: "*.rs"
      run: cargo clippy -- -D warnings
    shell-fmt:
      glob: "*.sh"
      run: shfmt -d -i 4 -ci {staged_files}
    shell-lint:
      glob: "*.sh"
      run: shellcheck {staged_files}
    swift-format:
      glob: "Hippo/**/*.swift"
      run: swiftformat --lint {staged_files}
    swift-build:
      glob: "Hippo/**/*.swift"
      root: "Hippo/"
      run: swift build -c release
    yaml-lint:
      glob: "*.yml"
      run: yamllint -s {staged_files}
